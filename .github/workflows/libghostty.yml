name: Public libghostty API

on:
  pull_request:
    paths:
      - "experiments/libghostty/**"
      - "e2e/fixtures/**"
      - ".github/workflows/libghostty.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "experiments/libghostty/**"
      - "e2e/fixtures/**"
      - ".github/workflows/libghostty.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-libghostty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Setup Zig
        run: |
          curl -sSfLo "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: experiments/libghostty/dist/global-cache
          key: public-libghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/libghostty/upstream.json') }}
      - run: pnpm install --frozen-lockfile
      - name: Check experiment formatting
        run: pnpm exec prettier --check 'experiments/libghostty/*.{mjs,json,md}' .github/workflows/libghostty.yml
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:libghostty
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-libghostty-results
          path: |
            experiments/libghostty/dist/build.json
            experiments/libghostty/dist/probe.json
            experiments/libghostty/dist/browsers.json
          if-no-files-found: ignore
