name: Fractional scroll Wayland

on:
  workflow_dispatch:
  push:
    branches:
      - fix/fractional-scroll-ownership
    paths:
      - ".github/workflows/fractional-scroll-wayland.yml"
      - "e2e/electron-wayland-scroll.mjs"
      - "packages/@wterm/dom/src/wterm.ts"
      - "packages/@wterm/dom/src/__tests__/wterm.test.ts"
      - "e2e/tests/terminal.spec.ts"

jobs:
  electron-wayland:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dpr: ["1.25", "1.6"]
        expected: [broken, fixed]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore the unfixed implementation
        if: matrix.expected == 'broken'
        run: git checkout 4a73024 -- packages/@wterm/dom/src/wterm.ts

      - name: Build the browser fixture
        run: |
          pnpm --filter @wterm/dom build
          pnpm --filter vite build

      - name: Install Wayland and Electron dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            weston dbus-x11 libasound2t64 libgbm1 libgtk-3-0
          pnpm exec playwright install-deps chromium

      - name: Start the Vite fixture
        run: |
          pnpm --filter vite preview --host 127.0.0.1 --port 4173 \
            > vite.log 2>&1 &
          echo $! > vite.pid
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/?debug >/dev/null && exit 0
            sleep 1
          done
          cat vite.log
          exit 1

      - name: Start Weston
        run: |
          runtime_dir="$RUNNER_TEMP/weston-${{ matrix.dpr }}-${{ matrix.expected }}"
          mkdir -p "$runtime_dir"
          chmod 700 "$runtime_dir"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wayland-1" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$runtime_dir" \
            weston --backend=headless-backend.so --socket=wayland-1 \
              --idle-time=0 --width=1280 --height=1024 \
              > weston.log 2>&1 &
          echo $! > weston.pid
          for attempt in $(seq 1 60); do
            test -S "$runtime_dir/wayland-1" && exit 0
            sleep 1
          done
          cat weston.log
          exit 1

      - name: Exercise Electron on Wayland
        env:
          DISPLAY: ""
          WTERM_DPR: ${{ matrix.dpr }}
          WTERM_EXPECT: ${{ matrix.expected }}
          WTERM_ARTIFACT_DIR: artifacts
        run: |
          dbus-run-session -- \
            pnpm dlx electron@43.4.0 e2e/electron-wayland-scroll.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fractional-scroll-${{ matrix.dpr }}-${{ matrix.expected }}
          path: |
            artifacts/
            vite.log
            weston.log
