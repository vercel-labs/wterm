name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ghostty-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Ghostty toolchain
        run: bash packages/@wterm/ghostty/scripts/install-zig.sh /tmp/ghostty-zig
      - name: Ghostty WASM drift check
        env:
          WTERM_GHOSTTY_ZIG: /tmp/ghostty-zig/zig
        run: bash packages/@wterm/ghostty/scripts/build-wasm.sh --check

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        run: |
          curl -sSfLo zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c
          tar -xJf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Zig tests
        run: zig build test

      - name: WASM drift check
        run: |
          zig build -Doptimize=ReleaseSmall
          if ! diff -q zig-out/bin/wterm.wasm packages/@wterm/core/wasm/wterm.wasm > /dev/null 2>&1; then
            echo "::error::Committed wterm.wasm does not match Zig sources. Rebuild with 'zig build -Doptimize=ReleaseSmall' and commit the updated packages/@wterm/core/wasm/wterm.wasm."
            exit 1
          fi

      - name: Clean Zig artifacts
        run: rm -rf zig-x86_64-linux-0.16.0 zig.tar.xz zig-out .zig-cache

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Build packages
        run: pnpm build

      - name: Docs route contract
        run: pnpm --filter @wterm/docs test:routes

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: E2E tests
        run: pnpm test:e2e

      - name: Homepage terminal tests
        run: pnpm --filter @wterm/docs test:terminal

      - name: Local workspace output reader tests
        run: pnpm --filter local test:e2e

      - name: Upload local workspace failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-workspace
          path: e2e/test-results/local/
          if-no-files-found: ignore

      - name: Upload homepage terminal failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-terminal
          path: e2e/test-results/docs-terminal/
          if-no-files-found: ignore

      - name: PTY and terminal replay tests
        run: pnpm test:pty

      - name: Terminal output-load smoke tests
        run: pnpm bench:terminal

      - name: Upload terminal output-load reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-output-load
          path: e2e/test-results/load/
          if-no-files-found: ignore

      - name: Terminal input responsiveness smoke tests
        run: pnpm bench:input

      - name: Upload terminal input responsiveness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-input-responsiveness
          path: e2e/test-results/input/
          if-no-files-found: ignore

      - name: Upload PTY baseline reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pty-baseline
          path: e2e/test-results/pty/
          if-no-files-found: ignore
