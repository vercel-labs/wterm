packages:
  - "packages/*"
  - "packages/@wterm/*"
  - "packages/@internal/*"
  - "apps/*"
  - "examples/*"
  - "e2e/harness"

minimumReleaseAge: 2880
# tsc-ts and its platform packages are Vercel Labs packages, exempt so the
# type-check can use a just-released tsc-ts.
minimumReleaseAgeExclude:
  - "@vercel/geistdocs@1.28.1"
  - "tsc-ts"
  - "@tsc-ts/*"

allowBuilds:
  "@mongodb-js/zstd": false
  "cpu-features": false
  "esbuild": false
  "msw": false
  "node-pty": true
  "node-liblzma": false
  "sharp": false
  "ssh2": false
  "unrs-resolver": false
